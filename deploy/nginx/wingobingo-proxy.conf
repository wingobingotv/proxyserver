# /etc/nginx/sites-available/wingobingo-proxy — Nginx in front of wingobingo-proxy.
#
# HTTP only on purpose: certbot adds the certificate and the https server.
#   sudo ln -s /etc/nginx/sites-available/wingobingo-proxy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d payment.api.wingobingo.tv --redirect
#
# 127.0.0.1:8080 must match PROXY_BIND:PROXY_HOST_PORT in the proxy's .env.
#
# Requirements the proxy depends on:
#   * Served at the domain root, URI passed unchanged (`proxy_pass` without a
#     path). Request signatures cover the exact path and query.
#   * X-Forwarded-For is SET to the client address, never appended, so a
#     client cannot inject its own; the proxy trusts it only from TRUSTED_PROXIES.
#   * Which servers may call /v1/providers/ is enforced by the proxy itself
#     (INTERNAL_ALLOWED_IPS + request signature).

limit_req_zone $binary_remote_addr zone=wbproxy_cb:10m rate=20r/s;

upstream wingobingo_proxy {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name payment.api.wingobingo.tv;

    server_tokens off;

    # Largest body the proxy accepts is 64 KiB; a little headroom.
    client_max_body_size 128k;
    client_body_buffer_size 128k;

    access_log /var/log/nginx/wingobingo-proxy.access.log;
    error_log  /var/log/nginx/wingobingo-proxy.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    # PARSCOIN_DEADLINE_MS (18 s) plus margin.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Provider callbacks: public, checked by the proxy (provider signature).
    location /callback/ {
        limit_req zone=wbproxy_cb burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://wingobingo_proxy;
    }

    # Player API → provider relay.
    location /v1/providers/ {
        proxy_pass http://wingobingo_proxy;
    }

    # Operations API: not used yet. To open it, replace `deny all` with
    # `allow <Admin API IP>; deny all;`.
    location /v1/admin/ {
        deny all;
    }

    location = /healthz { proxy_pass http://wingobingo_proxy; }
    location = /readyz  { proxy_pass http://wingobingo_proxy; }

    # Prometheus: to open it, replace `deny all` with `allow <monitoring IP>; deny all;`
    # (the proxy also requires METRICS_TOKEN).
    location = /metrics {
        deny all;
    }

    # Nothing else exists.
    location / { return 404; }
}
