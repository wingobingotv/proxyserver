# /etc/nginx/sites-available/wingobingo-proxy — Nginx in front of wingobingo-proxy.
#
# Replace before enabling:
#   proxy.example.com   → the proxy's domain (PUBLIC_BASE_URL)
#   127.0.0.1:8080      → PROXY_BIND:PROXY_HOST_PORT from .env
#   203.0.113.10        → Player API public IP (same as INTERNAL_ALLOWED_IPS)
#   203.0.113.20        → Admin API public IP (only if it uses an admin key)
#   198.51.100.30       → monitoring host scraping /metrics
#
# Certificates: certbot certonly --webroot -w /var/www/certbot -d proxy.example.com
#
# Requirements the proxy depends on:
#   * Served at the domain root, URI passed unchanged (`proxy_pass` without a
#     path). Request signatures cover the exact path and query.
#   * X-Forwarded-For is SET to the client address, never appended, so a
#     client cannot inject its own; the proxy trusts it only from TRUSTED_PROXIES.

limit_req_zone $binary_remote_addr zone=wbproxy_cb:10m rate=20r/s;

upstream wingobingo_proxy {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxy.example.com;

    ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wbproxy_tls:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    server_tokens off;

    # Largest body the proxy accepts is 64 KiB; a little headroom for headers.
    client_max_body_size 128k;
    client_body_buffer_size 128k;

    access_log /var/log/nginx/wingobingo-proxy.access.log;
    error_log  /var/log/nginx/wingobingo-proxy.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    # PARSCOIN_DEADLINE_MS (18 s) plus margin.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Provider callbacks: public, provider-authenticated by the proxy.
    location /callback/ {
        limit_req zone=wbproxy_cb burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://wingobingo_proxy;
    }

    # Player API → provider relay. The proxy also checks INTERNAL_ALLOWED_IPS and the HMAC.
    location /v1/providers/ {
        allow 203.0.113.10;
        deny all;
        proxy_pass http://wingobingo_proxy;
    }

    # Read-only operations API (admin-scoped HMAC key).
    location /v1/admin/ {
        allow 203.0.113.20;
        deny all;
        proxy_pass http://wingobingo_proxy;
    }

    location = /healthz { proxy_pass http://wingobingo_proxy; }
    location = /readyz  { proxy_pass http://wingobingo_proxy; }

    location = /metrics {
        allow 198.51.100.30;
        deny all;
        proxy_pass http://wingobingo_proxy;
    }

    # Nothing else exists.
    location / { return 404; }
}
